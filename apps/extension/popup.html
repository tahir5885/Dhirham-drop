<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DirhamDrop UAE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e2e8f0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      width: 26px;
      height: 26px;
      background: #059669;
      color: white;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 15px;
    }
    h1 {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .uae-badge {
      font-size: 10px;
      font-weight: 700;
      background: #ecfdf5;
      color: #047857;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #a7f3d0;
    }
    .status-box {
      font-size: 11.5px;
      padding: 9px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .status-box.info {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      color: #475569;
    }
    .status-box.ok {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #047857;
    }
    .deal-card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .deal-card.has-savings {
      border-color: #34d399;
      background: #f0fdf4;
    }
    .deal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .badge {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .badge-save {
      background: #059669;
      color: white;
    }
    .badge-match {
      background: #e2e8f0;
      color: #475569;
    }
    .current-site {
      font-size: 10px;
      color: #64748b;
      font-weight: 600;
    }
    .product-title {
      font-size: 12px;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.3;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .price-comparison {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
    }
    .price-comparison small {
      display: block;
      font-size: 9px;
      color: #64748b;
      text-transform: uppercase;
      font-weight: 700;
    }
    .price-val {
      font-size: 13px;
      font-weight: 800;
      color: #0f172a;
    }
    .price-val.highlight {
      color: #059669;
    }
    .arrow {
      color: #94a3b8;
      font-size: 16px;
    }
    .buy-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: #059669;
      color: white;
      text-decoration: none;
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      transition: background 0.2s;
    }
    .buy-btn:hover {
      background: #047857;
    }
    .sub-text {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      padding: 4px;
    }
    .search-box {
      margin-bottom: 10px;
    }
    .search-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
      background: white;
    }
    .search-input:focus {
      border-color: #059669;
    }
    .mini-result {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .mini-info {
      flex: 1;
      min-width: 0;
    }
    .mini-info strong {
      font-size: 11px;
      color: #1e293b;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mini-meta {
      font-size: 10px;
      color: #64748b;
      margin-top: 2px;
    }
    .mini-meta span {
      font-weight: 800;
      color: #059669;
    }
    .mini-btn {
      font-size: 10px;
      font-weight: 700;
      color: #059669;
      text-decoration: none;
      padding: 4px 8px;
      border: 1px solid #a7f3d0;
      background: #ecfdf5;
      border-radius: 6px;
      white-space: nowrap;
    }
    .loading-search, .no-res {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      padding: 8px;
    }
    .footer-links {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid #e2e8f0;
      font-size: 11px;
    }
    .footer-links a {
      color: #059669;
      text-decoration: none;
      font-weight: 700;
    }
    .footer-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo">د</div>
      <div>
        <h1>DirhamDrop</h1>
      </div>
    </div>
    <span class="uae-badge">🇦🇪 UAE Active</span>
  </div>

  <!-- Active Tab Detection Section -->
  <div id="active-tab-section">
    <div class="status-box info">
      Scanning active tab...
    </div>
  </div>

  <!-- Quick Search Section -->
  <div class="search-box">
    <form id="search-form">
      <input
        type="text"
        id="search-input"
        class="search-input"
        placeholder="Quick search UAE stores (e.g. Sony, iPhone)..."
      />
    </form>
  </div>
  <div id="search-results"></div>

  <!-- Footer Links -->
  <div class="footer-links">
    <a href="http://localhost:3000/deals" target="_blank">🔥 Top UAE Deals</a>
    <a href="http://localhost:3000" target="_blank">Open Hub &rarr;</a>
  </div>

  <script src="dist/popup.js"></script>
</body>
</html>
